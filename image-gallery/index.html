<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visual Collection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-section">
        <div>
            <p class="label">PHOTO COLLECTION</p>
            <h1>Visual Stories</h1>
            <p class="description">
                Explore a small collection of places, nature and everyday moments.
            </p>
        </div>
    </header>

    <section class="gallery-section">

        <div class="gallery-heading">
            <h2>Explore</h2>
            <span>Choose an image</span>
        </div>

        <div id="gallery" class="gallery"></div>

    </section>

    <section class="viewer">

        <div class="viewer-header">
            <h2>Preview</h2>

            <button id="toggleBtn" type="button">
                Darken Image
            </button>
        </div>

        <div class="image-frame">
            <img id="largeImage" src="" alt="Selected gallery image">
        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
