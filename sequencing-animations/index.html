
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MotionFlow - Animation Playground</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header>
            <p class="tag">JAVASCRIPT ANIMATION</p>

            <h1>MotionFlow</h1>

            <p class="subtitle">
                Watch a ball perform different animations
                one after another!
            </p>
        </header>

        <!-- Animation Status -->
        <section class="status">

            <div class="status-item">
                <span>Current Step</span>
                <h3 id="statusText">Ready to start</h3>
            </div>

            <div class="status-item">
                <span>Progress</span>
                <h3 id="progressText">0 / 5</h3>
            </div>

        </section>

        <!-- Animation Stage -->
        <section class="animation-area">

            <div id="ball" class="ball"></div>

        </section>

        <!-- Progress Bar -->
        <div class="progress-container">

            <div id="progressBar"></div>

        </div>

        <!-- Buttons -->
        <div class="controls">

            <button id="playBtn" type="button">
                ▶ Play Animation
            </button>

            <button id="resetBtn" type="button">
                ↻ Reset
            </button>

        </div>

        <!-- Animation Steps -->
        <section class="steps">

            <h2>Animation Sequence</h2>

            <ul>

                <li id="step1">01. Move Right</li>

                <li id="step2">02. Bounce</li>

                <li id="step3">03. Change Colour</li>

                <li id="step4">04. Grow Bigger</li>

                <li id="step5">05. Rotate</li>

            </ul>

        </section>

        <footer>
            Built with HTML, CSS and JavaScript
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
